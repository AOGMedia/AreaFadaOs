name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-test:
    name: Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck shared packages
        run: pnpm run typecheck:libs

      - name: Typecheck backend
        run: pnpm --filter @workspace/api-server run typecheck

      - name: Typecheck web
        run: pnpm --filter @workspace/areafadaos run typecheck

      - name: Typecheck mobile
        run: pnpm --filter @workspace/areafada-revenue run typecheck

      - name: Run backend unit tests
        run: pnpm --filter @workspace/api-server run test

  build-web:
    name: Build Web (Vercel smoke-check)
    runs-on: ubuntu-latest
    needs: typecheck-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm run typecheck:libs

      - name: Build web
        run: pnpm --filter @workspace/areafadaos run build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
