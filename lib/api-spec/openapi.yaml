components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    SubscriptionTier:
      type: string
      enum: [free, creator, brand, agency, enterprise]

    Platform:
      type: string
      enum: [instagram, tiktok, x, youtube, facebook, threads]

    PostStatus:
      type: string
      enum: [draft, scheduled, published, failed]

    CaptionTone:
      type: string
      enum: [pidgin, yoruba, igbo, hausa, formal]

    DealStatus:
      type: string
      enum: [inbound, negotiating, agreed, deliverable_due, invoiced, paid, cancelled]

    InvoiceStatus:
      type: string
      enum: [draft, sent, paid, overdue, cancelled]

    Currency:
      type: string
      enum: [NGN, GHS, KES, ZAR, USD]

    PaymentGateway:
      type: string
      enum: [paystack, flutterwave]

    UserProfile:
      type: object
      required: [id, clerkId, email, displayName, tier, createdAt]
      properties:
        id:
          type: integer
        clerkId:
          type: string
        email:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: ["string", "null"]
        tier:
          $ref: "#/components/schemas/SubscriptionTier"
        bio:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    UserProfileUpdate:
      type: object
      properties:
        displayName:
          type: string
        bio:
          type: string
        country:
          type: string
        avatarUrl:
          type: string

    TierInfo:
      type: object
      required: [tier, tierName, monthlyPrice, features, moduleAccess]
      properties:
        tier:
          $ref: "#/components/schemas/SubscriptionTier"
        tierName:
          type: string
        monthlyPrice:
          type: ["number", "null"]
        features:
          type: array
          items:
            type: string
        moduleAccess:
          type: object
          properties:
            scheduling:
              type: boolean
            monetization:
              type: boolean
            analytics:
              type: boolean
            ambassadorCrm:
              type: boolean
            bookPromo:
              type: boolean
            liveVideo:
              type: boolean
            clipEngine:
              type: boolean
            autoPost:
              type: boolean
            trafficTools:
              type: boolean
            fanHub:
              type: boolean
            campaignIntelligence:
              type: boolean
          required:
            - scheduling
            - monetization
            - analytics
            - ambassadorCrm
            - bookPromo
            - liveVideo
            - clipEngine
            - autoPost
            - trafficTools
            - fanHub
            - campaignIntelligence

    ModuleKey:
      type: string
      enum:
        - scheduling
        - monetization
        - analytics
        - ambassadorCrm
        - bookPromo
        - liveVideo
        - clipEngine
        - autoPost
        - trafficTools
        - fanHub
        - campaignIntelligence

    DashboardSummary:
      type: object
      required: [postsScheduled, revenueThisMonth, activeBrandDeals, ambassadorCount, fanHubMembers, totalReach]
      properties:
        postsScheduled:
          type: integer
        revenueThisMonth:
          type: number
        activeBrandDeals:
          type: integer
        ambassadorCount:
          type: integer
        fanHubMembers:
          type: integer
        totalReach:
          type: integer
        platformsConnected:
          type: integer
        aiCaptionsGenerated:
          type: integer

    ActivityItem:
      type: object
      required: [id, type, description, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
        description:
          type: string
        metadata:
          type: ["object", "null"]
        createdAt:
          type: string
          format: date-time

    Post:
      type: object
