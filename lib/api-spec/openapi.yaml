openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AreaFada OS API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User profile and subscription management
  - name: dashboard
    description: Dashboard summary and activity
  - name: scheduling
    description: Content scheduling and calendar
  - name: campaigns
    description: Campaign management
  - name: captions
    description: AI caption generation
  - name: monetization
    description: Brand deals, invoices, affiliate links, and revenue analytics

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    patch:
      operationId: updateMe
      tags: [users]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /users/me/tier:
    get:
      operationId: getMyTier
      tags: [users]
      summary: Get current user subscription tier details
      responses:
        "200":
          description: Tier info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TierInfo"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard stats summary for current user
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/activity:
    get:
      operationId: getDashboardActivity
      tags: [dashboard]
      summary: Get recent activity feed for current user
      responses:
        "200":
          description: Activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /posts:
    get:
      operationId: listPosts
      tags: [scheduling]
      summary: List posts for current user
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, scheduled, published, failed]
        - name: campaignId
          in: query
          schema:
            type: integer
        - name: platform
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: List of posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"
    post:
      operationId: createPost
      tags: [scheduling]
      summary: Create a new post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostBody"
      responses:
        "201":
          description: Created post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

  /posts/{id}:
    get:
      operationId: getPost
      tags: [scheduling]
      summary: Get a post by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "404":
          description: Not found
    patch:
      operationId: updatePost
      tags: [scheduling]
      summary: Update a post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePostBody"
      responses:
        "200":
          description: Updated post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
    delete:
      operationId: deletePost
      tags: [scheduling]
      summary: Delete a post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /posts/bulk-upload:
    post:
      operationId: bulkUploadPosts
      tags: [scheduling]
      summary: Bulk import posts from CSV data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkUploadBody"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkUploadResult"

  /posts/{id}/recycle:
    post:
      operationId: recyclePost
      tags: [scheduling]
      summary: Recycle a post with AI-refreshed caption
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecyclePostBody"
      responses:
        "201":
          description: Recycled post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

  /posts/hashtags:
    get:
      operationId: getTrendingHashtags
      tags: [scheduling]
      summary: Get trending hashtags for African regions per platform
      parameters:
        - name: platform
          in: query
          schema:
            type: string
        - name: region
          in: query
          schema:
            type: string
            default: NG
      responses:
        "200":
          description: Trending hashtags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HashtagItem"

  /posts/captions:
    post:
      operationId: generateCaptions
      tags: [captions]
      summary: Generate AI captions with Nigerian tone profiles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateCaptionsBody"
      responses:
        "200":
          description: Generated captions per platform per tone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateCaptionsResponse"

  /campaigns:
    get:
      operationId: listCampaigns
      tags: [campaigns]
      summary: List campaigns for current user
      responses:
        "200":
          description: List of campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Campaign"
    post:
      operationId: createCampaign
      tags: [campaigns]
      summary: Create a campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCampaignBody"
      responses:
        "201":
          description: Created campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"

  /campaigns/{id}:
    patch:
      operationId: updateCampaign
      tags: [campaigns]
      summary: Update a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCampaignBody"
      responses:
        "200":
          description: Updated campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
    delete:
      operationId: deleteCampaign
      tags: [campaigns]
      summary: Delete a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /platform-accounts:
    get:
      operationId: listPlatformAccounts
      tags: [scheduling]
      summary: List connected platform accounts
      responses:
        "200":
          description: Platform accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformAccount"

  /posts/{id}/history:
    get:
      operationId: getPostHistory
      tags: [scheduling]
      summary: Get revision history for a post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Revision list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PostRevision"

  # ─── Monetization ────────────────────────────────────────────────────────────

  /brand-deals:
    get:
      operationId: listBrandDeals
      tags: [monetization]
      summary: List brand deals for current user
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/DealStatus"
      responses:
        "200":
          description: List of brand deals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BrandDeal"
    post:
      operationId: createBrandDeal
      tags: [monetization]
      summary: Create a brand deal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBrandDealBody"
      responses:
        "201":
          description: Created brand deal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandDeal"

  /brand-deals/{id}:
    patch:
      operationId: updateBrandDeal
      tags: [monetization]
      summary: Update a brand deal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBrandDealBody"
      responses:
        "200":
          description: Updated brand deal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandDeal"
    delete:
      operationId: deleteBrandDeal
      tags: [monetization]
      summary: Delete a brand deal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /invoices:
    get:
      operationId: listInvoices
      tags: [monetization]
      summary: List invoices for current user
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/InvoiceStatus"
      responses:
        "200":
          description: List of invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
    post:
      operationId: createInvoice
      tags: [monetization]
      summary: Create an invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvoiceBody"
      responses:
        "201":
          description: Created invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /invoices/{id}:
    get:
      operationId: getInvoice
      tags: [monetization]
      summary: Get invoice with line items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Invoice with line items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceDetail"
    patch:
      operationId: updateInvoice
      tags: [monetization]
      summary: Update an invoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvoiceBody"
      responses:
        "200":
          description: Updated invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
    delete:
      operationId: deleteInvoice
      tags: [monetization]
      summary: Delete an invoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /invoices/{id}/payment-link:
    post:
      operationId: generatePaymentLink
      tags: [monetization]
      summary: Generate a Paystack or Flutterwave payment link for an invoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratePaymentLinkBody"
      responses:
        "200":
          description: Payment link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentLinkResponse"

  /invoices/{id}/remind:
    post:
      operationId: sendPaymentReminder
      tags: [monetization]
      summary: Send a payment reminder for an overdue invoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reminder sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentReminder"

  /affiliate-links:
    get:
      operationId: listAffiliateLinks
      tags: [monetization]
      summary: List affiliate links for current user
      responses:
        "200":
          description: List of affiliate links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AffiliateLink"
    post:
      operationId: createAffiliateLink
      tags: [monetization]
      summary: Create an affiliate link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAffiliateLinkBody"
      responses:
        "201":
          description: Created affiliate link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AffiliateLink"

  /affiliate-links/{id}:
    patch:
      operationId: updateAffiliateLink
      tags: [monetization]
      summary: Update an affiliate link
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAffiliateLinkBody"
      responses:
        "200":
          description: Updated affiliate link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AffiliateLink"
    delete:
      operationId: deleteAffiliateLink
      tags: [monetization]
      summary: Delete an affiliate link
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /monetization/revenue:
    get:
      operationId: getRevenueWaterfall
      tags: [monetization]
      summary: Get revenue breakdown by source and currency for the waterfall chart
      parameters:
        - name: currency
          in: query
          schema:
            $ref: "#/components/schemas/Currency"
          description: Normalise all values to this currency (default NGN)
        - name: months
          in: query
          schema:
            type: integer
            default: 6
      responses:
        "200":
          description: Revenue waterfall data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevenueWaterfall"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    SubscriptionTier:
      type: string
      enum: [free, creator, brand, agency, enterprise]

    Platform:
      type: string
      enum: [instagram, tiktok, x, youtube, facebook, threads]

    PostStatus:
      type: string
      enum: [draft, scheduled, published, failed]

    CaptionTone:
      type: string
      enum: [pidgin, yoruba, igbo, hausa, formal]

    DealStatus:
      type: string
      enum: [inbound, negotiating, agreed, deliverable_due, invoiced, paid, cancelled]

    InvoiceStatus:
      type: string
      enum: [draft, sent, paid, overdue, cancelled]

    Currency:
      type: string
      enum: [NGN, GHS, KES, ZAR, USD]

    PaymentGateway:
      type: string
      enum: [paystack, flutterwave, manual]

    UserProfile:
      type: object
      required: [id, clerkId, email, displayName, tier, createdAt]
      properties:
        id:
          type: integer
        clerkId:
          type: string
        email:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: ["string", "null"]
        tier:
          $ref: "#/components/schemas/SubscriptionTier"
        bio:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    UserProfileUpdate:
      type: object
      properties:
        displayName:
          type: string
        bio:
          type: string
        country:
          type: string
        avatarUrl:
          type: string

    TierInfo:
      type: object
      required: [tier, tierName, monthlyPrice, features, moduleAccess]
      properties:
        tier:
          $ref: "#/components/schemas/SubscriptionTier"
        tierName:
          type: string
        monthlyPrice:
          type: ["number", "null"]
        features:
          type: array
          items:
            type: string
        moduleAccess:
          type: object
          properties:
            scheduling:
              type: boolean
            monetization:
              type: boolean
            analytics:
              type: boolean
            ambassadorCrm:
              type: boolean
            bookPromo:
              type: boolean
            liveVideo:
              type: boolean
            clipEngine:
              type: boolean
            autoPost:
              type: boolean
            trafficTools:
              type: boolean
            fanHub:
              type: boolean
            campaignIntelligence:
              type: boolean
          required:
            - scheduling
            - monetization
            - analytics
            - ambassadorCrm
            - bookPromo
            - liveVideo
            - clipEngine
            - autoPost
            - trafficTools
            - fanHub
            - campaignIntelligence

    ModuleKey:
      type: string
      enum:
        - scheduling
        - monetization
        - analytics
        - ambassadorCrm
        - bookPromo
        - liveVideo
        - clipEngine
        - autoPost
        - trafficTools
        - fanHub
        - campaignIntelligence

    DashboardSummary:
      type: object
      required: [postsScheduled, revenueThisMonth, activeBrandDeals, ambassadorCount, fanHubMembers, totalReach]
      properties:
        postsScheduled:
          type: integer
        revenueThisMonth:
          type: number
        activeBrandDeals:
          type: integer
        ambassadorCount:
          type: integer
        fanHubMembers:
          type: integer
        totalReach:
          type: integer
        platformsConnected:
          type: integer
        aiCaptionsGenerated:
          type: integer

    ActivityItem:
      type: object
      required: [id, type, description, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
        description:
          type: string
        metadata:
          type: ["object", "null"]
        createdAt:
          type: string
          format: date-time

    Post:
      type: object
      required: [id, userId, caption, mediaUrls, platforms, status, hashtags, engagementScore, isRecycled, version, createdAt, updatedAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        campaignId:
          type: ["integer", "null"]
        caption:
          type: string
        mediaUrls:
          type: array
          items:
            type: string
        platforms:
          type: array
          items:
            $ref: "#/components/schemas/Platform"
        status:
          $ref: "#/components/schemas/PostStatus"
        scheduledAt:
          type: ["string", "null"]
          format: date-time
        publishedAt:
          type: ["string", "null"]
          format: date-time
        tone:
          type: ["string", "null"]
        hashtags:
          type: array
          items:
            type: string
        platformVariants:
          type: ["object", "null"]
        engagementScore:
          type: integer
        isRecycled:
          type: boolean
        originalPostId:
          type: ["integer", "null"]
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PostRevision:
      type: object
      required: [id, postId, userId, caption, platforms, hashtags, status, version, createdAt]
      properties:
        id:
          type: integer
        postId:
          type: integer
        userId:
          type: integer
        caption:
          type: string
        platforms:
          type: array
          items:
            $ref: "#/components/schemas/Platform"
        hashtags:
          type: array
          items:
            type: string
        status:
          $ref: "#/components/schemas/PostStatus"
        scheduledAt:
          type: ["string", "null"]
          format: date-time
        changeNote:
          type: ["string", "null"]
        version:
          type: integer
        createdAt:
          type: string
          format: date-time

    CreatePostBody:
      type: object
      required: [caption, platforms]
      properties:
        caption:
          type: string
        platforms:
          type: array
          items:
            $ref: "#/components/schemas/Platform"
        campaignId:
          type: integer
        scheduledAt:
          type: string
          format: date-time
        tone:
          $ref: "#/components/schemas/CaptionTone"
        hashtags:
          type: array
          items:
            type: string
        mediaUrls:
          type: array
          items:
            type: string
        platformVariants:
          type: object

    UpdatePostBody:
      type: object
      properties:
        caption:
          type: string
        platforms:
          type: array
          items:
            $ref: "#/components/schemas/Platform"
        campaignId:
          type: integer
        scheduledAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/PostStatus"
        tone:
          $ref: "#/components/schemas/CaptionTone"
        hashtags:
          type: array
          items:
            type: string
        mediaUrls:
          type: array
          items:
            type: string
        platformVariants:
          type: object
        changeNote:
          type: string

    BulkUploadBody:
      type: object
      required: [posts]
      properties:
        posts:
          type: array
          maxItems: 50
          items:
            type: object
            required: [caption, platforms]
            properties:
              caption:
                type: string
              platforms:
                type: array
                items:
                  $ref: "#/components/schemas/Platform"
              scheduledAt:
                type: string
              hashtags:
                type: array
                items:
                  type: string
              campaignId:
                type: integer

    BulkUploadResult:
      type: object
      required: [imported, failed, posts]
      properties:
        imported:
          type: integer
        failed:
          type: integer
        posts:
          type: array
          items:
            $ref: "#/components/schemas/Post"

    RecyclePostBody:
      type: object
      required: [platforms, scheduledAt]
      properties:
        platforms:
          type: array
          items:
            $ref: "#/components/schemas/Platform"
        scheduledAt:
          type: string
          format: date-time
        tone:
          $ref: "#/components/schemas/CaptionTone"
        refreshCaption:
          type: boolean
          default: true

    HashtagItem:
      type: object
      required: [hashtag, platform, region, trendScore]
      properties:
        hashtag:
          type: string
        platform:
          type: string
        region:
          type: string
        trendScore:
          type: integer
        category:
          type: ["string", "null"]

    GenerateCaptionsBody:
      type: object
      required: [topic, tones, platforms]
      properties:
        topic:
          type: string
        tones:
          type: array
          items:
            $ref: "#/components/schemas/CaptionTone"
        platforms:
          type: array
          items:
            $ref: "#/components/schemas/Platform"
        context:
          type: string
        hashtags:
          type: array
          items:
            type: string

    GenerateCaptionsResponse:
      type: object
      required: [captions]
      properties:
        captions:
          type: array
          items:
            type: object
            required: [tone, variants]
            properties:
              tone:
                $ref: "#/components/schemas/CaptionTone"
