openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AreaFada OS API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User profile and subscription management
  - name: dashboard
    description: Dashboard summary and activity
  - name: scheduling
    description: Content scheduling and calendar
  - name: campaigns
    description: Campaign management
  - name: captions
    description: AI caption generation
  - name: monetization
    description: Brand deals, invoices, affiliate links, and revenue analytics
  - name: analytics
    description: Analytics, audience geography, best post times, engagement scores, and reports
  - name: ambassadors
    description: Ambassador CRM, gamification, leaderboard, micro-influencer directory, WhatsApp broadcast log
  - name: bookPromo
    description: Book Download Promotion Engine — campaigns, tracked links, QR codes, funnel analytics, drip scheduler, fan verifications, affiliate commissions
  - name: liveVideo
    description: Live Video & Real-Time Engagement — sessions, broadcast setup, chat moderation, fan reminders, revenue tracking, post-live clip generator
  - name: autoPost
    description: Intelligent Auto-Post Engine — multi-platform composer, AI caption variants, hashtag engine, posting time optimizer, account groups, approval workflow, compliance checker, publish job tracker
  - name: traffic
    description: Traffic Generator & Traffic Engine — campaign management, multi-channel activation, Meta Ads Africa presets, WhatsApp blasts, influencer activation, growth snapshots, viral hook library, SEO content engine, content velocity recommender

  - name: fanHub
    description: Charly Boy Area Fada Fan Hub — fan profiles, tier qualification, leaderboard, challenges, content vault, merch codes, OG invites, fan analytics

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    patch:
      operationId: updateMe
      tags: [users]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /users/me/tier:
    get:
      operationId: getMyTier
      tags: [users]
      summary: Get current user subscription tier details
      responses:
        "200":
          description: Tier info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TierInfo"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard stats summary for current user
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/activity:
    get:
      operationId: getDashboardActivity
      tags: [dashboard]
      summary: Get recent activity feed for current user
      responses:
        "200":
          description: Activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /posts:
    get:
      operationId: listPosts
      tags: [scheduling]
      summary: List posts for current user
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, scheduled, published, failed]
        - name: campaignId
          in: query
          schema:
            type: integer
        - name: platform
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: List of posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"
    post:
      operationId: createPost
      tags: [scheduling]
      summary: Create a new post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostBody"
      responses:
        "201":
          description: Created post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

  /posts/{id}:
    get:
      operationId: getPost
      tags: [scheduling]
      summary: Get a post by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "404":
          description: Not found
    patch:
      operationId: updatePost
      tags: [scheduling]
      summary: Update a post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePostBody"
      responses:
        "200":
          description: Updated post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
    delete:
      operationId: deletePost
      tags: [scheduling]
      summary: Delete a post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /posts/bulk-upload:
    post:
      operationId: bulkUploadPosts
      tags: [scheduling]
      summary: Bulk import posts from CSV data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkUploadBody"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkUploadResult"

  /posts/{id}/recycle:
    post:
      operationId: recyclePost
      tags: [scheduling]
      summary: Recycle a post with AI-refreshed caption
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecyclePostBody"
      responses:
        "201":
          description: Recycled post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

  /posts/hashtags:
    get:
      operationId: getTrendingHashtags
      tags: [scheduling]
      summary: Get trending hashtags for African regions per platform
      parameters:
        - name: platform
          in: query
          schema:
            type: string
        - name: region
          in: query
          schema:
            type: string
            default: NG
      responses:
        "200":
          description: Trending hashtags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HashtagItem"

  /posts/captions:
    post:
      operationId: generateCaptions
      tags: [captions]
      summary: Generate AI captions with Nigerian tone profiles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateCaptionsBody"
      responses:
        "200":
          description: Generated captions per platform per tone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateCaptionsResponse"

  /campaigns:
    get:
      operationId: listCampaigns
      tags: [campaigns]
      summary: List campaigns for current user
      responses:
        "200":
          description: List of campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Campaign"
    post:
      operationId: createCampaign
      tags: [campaigns]
      summary: Create a campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCampaignBody"
      responses:
        "201":
          description: Created campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"

  /campaigns/{id}:
    patch:
      operationId: updateCampaign
      tags: [campaigns]
      summary: Update a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCampaignBody"
      responses:
        "200":
          description: Updated campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
    delete:
      operationId: deleteCampaign
      tags: [campaigns]
      summary: Delete a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /platform-accounts:
    get:
      operationId: listPlatformAccounts
      tags: [scheduling]
      summary: List connected platform accounts
      responses:
        "200":
          description: Platform accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformAccount"

  /posts/{id}/history:
    get:
      operationId: getPostHistory
      tags: [scheduling]
      summary: Get revision history for a post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Revision list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PostRevision"

  # ─── Monetization ────────────────────────────────────────────────────────────

  /brand-deals:
    get:
      operationId: listBrandDeals
      tags: [monetization]
      summary: List brand deals for current user
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/DealStatus"
      responses:
        "200":
          description: List of brand deals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BrandDeal"
    post:
      operationId: createBrandDeal
      tags: [monetization]
      summary: Create a brand deal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBrandDealBody"
      responses:
        "201":
          description: Created brand deal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandDeal"

  /brand-deals/{id}:
    patch:
      operationId: updateBrandDeal
      tags: [monetization]
      summary: Update a brand deal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBrandDealBody"
      responses:
        "200":
          description: Updated brand deal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandDeal"
    delete:
      operationId: deleteBrandDeal
      tags: [monetization]
      summary: Delete a brand deal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /invoices:
    get:
      operationId: listInvoices
      tags: [monetization]
      summary: List invoices for current user
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/InvoiceStatus"
      responses:
        "200":
          description: List of invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
    post:
      operationId: createInvoice
      tags: [monetization]
      summary: Create an invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvoiceBody"
      responses:
        "201":
          description: Created invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /invoices/{id}:
    get:
      operationId: getInvoice
      tags: [monetization]
      summary: Get invoice with line items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Invoice with line items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceDetail"
    patch:
      operationId: updateInvoice
      tags: [monetization]
      summary: Update an invoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvoiceBody"
      responses:
        "200":
          description: Updated invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
    delete:
      operationId: deleteInvoice
      tags: [monetization]
      summary: Delete an invoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /invoices/{id}/payment-link:
    post:
      operationId: generatePaymentLink
      tags: [monetization]
      summary: Generate a Paystack or Flutterwave payment link for an invoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratePaymentLinkBody"
      responses:
        "200":
          description: Payment link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentLinkResponse"

  /invoices/{id}/remind:
    post:
      operationId: sendPaymentReminder
      tags: [monetization]
      summary: Send a payment reminder for an overdue invoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reminder sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentReminder"

  /affiliate-links:
    get:
      operationId: listAffiliateLinks
      tags: [monetization]
      summary: List affiliate links for current user
      responses:
        "200":
          description: List of affiliate links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AffiliateLink"
    post:
      operationId: createAffiliateLink
      tags: [monetization]
      summary: Create an affiliate link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAffiliateLinkBody"
      responses:
        "201":
          description: Created affiliate link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AffiliateLink"

  /affiliate-links/{id}:
    patch:
      operationId: updateAffiliateLink
      tags: [monetization]
      summary: Update an affiliate link
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAffiliateLinkBody"
      responses:
        "200":
          description: Updated affiliate link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AffiliateLink"
    delete:
      operationId: deleteAffiliateLink
      tags: [monetization]
      summary: Delete an affiliate link
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── Analytics ───────────────────────────────────────────────────────────────

  /analytics/summary:
    get:
      operationId: getAnalyticsSummary
      tags: [analytics]
      summary: Unified analytics summary across all platforms
      responses:
        "200":
          description: Analytics summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsSummary"

  /analytics/audience:
    get:
      operationId: getAudienceGeography
      tags: [analytics]
      summary: Audience geography — Nigeria states + diaspora heatmap
      parameters:
        - name: platform
          in: query
          schema:
            type: string
            default: instagram
      responses:
        "200":
          description: Audience geography data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudienceGeography"

  /analytics/best-times:
    get:
      operationId: getBestPostTimes
      tags: [analytics]
      summary: Best time to post heatmap per platform (WAT optimised)
      parameters:
        - name: platform
          in: query
          schema:
            type: string
            default: instagram
      responses:
        "200":
          description: Best post times heatmap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BestPostTimes"

  /analytics/post-performance:
    get:
      operationId: getPostPerformance
      tags: [analytics]
      summary: Post performance with engagement quality scores
      parameters:
        - name: platform
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Post performance list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PostPerformanceItem"

  /analytics/platform-comparison:
    get:
      operationId: getPlatformComparison
      tags: [analytics]
      summary: Side-by-side platform comparison
      responses:
        "200":
          description: Platform comparison data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformComparisonItem"

  /analytics/reports/generate:
    post:
      operationId: generateAnalyticsReport
      tags: [analytics]
      summary: Generate a white-label PDF analytics report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateReportBody"
      responses:
        "200":
          description: Generated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsReport"

  /analytics/reports/{id}/pdf:
    get:
      operationId: downloadAnalyticsReportPdf
      tags: [analytics]
      summary: Download analytics report as a binary PDF
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Report ID
      responses:
        "200":
          description: PDF file (application/pdf)
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Report not found

  # ─── Ambassador CRM ──────────────────────────────────────────────────────────

  /ambassadors:
    get:
      operationId: listAmbassadors
      tags: [ambassadors]
      summary: List ambassadors, optionally filtered by state/zone/tier/status
      parameters:
        - { name: state, in: query, schema: { type: string } }
        - { name: zone, in: query, schema: { type: string } }
        - { name: tier, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
      responses:
        "200":
          description: List of ambassadors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ambassador"
    post:
      operationId: createAmbassador
      tags: [ambassadors]
      summary: Add a new ambassador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAmbassadorBody"
      responses:
        "201":
          description: Created ambassador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ambassador"

  /ambassadors/{id}:
    patch:
      operationId: updateAmbassador
      tags: [ambassadors]
      summary: Update an ambassador
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAmbassadorBody"
      responses:
        "200":
          description: Updated ambassador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ambassador"
    delete:
      operationId: deleteAmbassador
      tags: [ambassadors]
      summary: Delete an ambassador
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204":
          description: Deleted

  /ambassadors/leaderboard:
    get:
      operationId: getAmbassadorLeaderboard
      tags: [ambassadors]
      summary: Get ranked ambassador leaderboard
      responses:
        "200":
          description: Ranked leaderboard
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ambassador"

  /ambassadors/leaderboard/csv:
    get:
      operationId: downloadLeaderboardCsv
      tags: [ambassadors]
      summary: Download leaderboard as CSV
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string

  /ambassadors/{id}/points:
    post:
      operationId: awardPoints
      tags: [ambassadors]
      summary: Award points to an ambassador
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AwardPointsBody"
      responses:
        "200":
          description: Updated ambassador with points
          content:
            application/json:
              schema:
                type: object
                properties:
                  ambassador:
                    $ref: "#/components/schemas/Ambassador"
                  pointsAwarded:
                    type: integer

  /ambassador-tasks:
    get:
      operationId: listAmbassadorTasks
      tags: [ambassadors]
      summary: List ambassador tasks
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AmbassadorTask"
    post:
      operationId: createAmbassadorTask
      tags: [ambassadors]
      summary: Create an ambassador task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAmbassadorTaskBody"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmbassadorTask"

  /ambassador-tasks/{id}:
    patch:
      operationId: updateAmbassadorTask
      tags: [ambassadors]
      summary: Update or cancel a task
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAmbassadorTaskBody"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmbassadorTask"

  /ambassador-tasks/{id}/complete:
    post:
      operationId: completeAmbassadorTask
      tags: [ambassadors]
      summary: Mark a task as completed by an ambassador
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ambassadorId:
                  type: integer
                notes:
                  type: string
              required: [ambassadorId]
      responses:
        "200":
          description: Completion result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  pointsAwarded:
                    type: integer

  /gamification-configs:
    get:
      operationId: getGamificationConfigs
      tags: [ambassadors]
      summary: Get gamification point configuration and reward tiers
      responses:
        "200":
          description: Gamification config
          content:
            application/json:
              schema:
                type: object
                properties:
                  configs:
                    type: array
                    items:
                      $ref: "#/components/schemas/GamificationConfig"
                  rewardTiers:
                    type: array
                    items:
                      $ref: "#/components/schemas/RewardTier"
    post:
      operationId: createGamificationConfig
      tags: [ambassadors]
      summary: Add a new gamification action
      requestBody:
        required: true
        content:
          application/json:
            schema:
